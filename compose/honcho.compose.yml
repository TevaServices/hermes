# Honcho — durable agent memory (https://github.com/plastic-labs/honcho).
#
# Local:  mise run up
# Komodo: part of the "hermes" Stack (<owner>/komodo -> resources.toml),
# which merges this file with hermes.compose.yml + firecrawl.compose.yml.
#
# Honcho has no prebuilt registry image, so compose builds straight from
# the upstream git repo at a pinned ref (mise.toml [env] ->
# HONCHO_VERSION). Bumping the pin and redeploying is the update path.
# git must be installed on the machine running `docker compose up`
# (git build contexts are resolved client-side).

services:
  honcho-api:
    build:
      context: https://github.com/plastic-labs/honcho.git#${HONCHO_VERSION:-main}
    image: honcho:${HONCHO_VERSION:-main}
    container_name: honcho-api
    restart: unless-stopped
    # Matches upstream docker-compose.yml.example
    entrypoint: ["sh", "docker/entrypoint.sh"]
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/honcho.env
    environment:
      # Upstream default is trust auth (POSTGRES_HOST_AUTH_METHOD=trust,
      # honcho-db never leaves the compose network), so the URI needs no
      # password. The +psycopg driver suffix matters: the image ships
      # psycopg v3, and a bare postgresql:// URI selects the psycopg2
      # dialect, which is not installed. If you switch honcho-db to
      # password auth, set POSTGRES_PASSWORD in honcho.env (flows in via
      # env_file), drop trust, and put the password in the URI here.
      DB_CONNECTION_URI: postgresql+psycopg://postgres@honcho-db:5432/postgres
      # honcho-redis is an alias of the shared valkey container
      # (compose/valkey.compose.yml); /1 isolates Honcho's keys from
      # Firecrawl's (Firecrawl uses the default /0).
      CACHE_URL: redis://honcho-redis:6379/1
      CACHE_ENABLED: "true"
    depends_on:
      honcho-db:
        condition: service_started
      valkey:
        condition: service_started
      # Every deriver/summary/dialectic step is an LLM call to the gateway,
      # and litellm binds its port only after its startup catalogue fetch.
      # Starting first means those calls fail — and a deriver that fails is
      # the quietest failure in this stack (memory simply stops accumulating).
      litellm:
        condition: service_healthy
    networks:
      hermes-net:
        aliases: [honcho-api]
    # Expose only if you want to hit the API from off-host; the agents
    # and the MCP server reach it over hermes-net. Bind to loopback.
    # ports:
    #   - "127.0.0.1:8000:8000"

  honcho-deriver:
    # Background worker that derives dialectic/symbolic representations.
    # Same image as the API.
    image: honcho:${HONCHO_VERSION:-main}
    container_name: honcho-deriver
    restart: unless-stopped
    command: ["python", "-m", "src.deriver"]
    env_file:
      - ${HERMES_ENV_DIR:?}/honcho.env
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://postgres@honcho-db:5432/postgres
      # honcho-redis is an alias of the shared valkey container
      # (compose/valkey.compose.yml); /1 isolates Honcho's keys from
      # Firecrawl's (Firecrawl uses the default /0).
      CACHE_URL: redis://honcho-redis:6379/1
      CACHE_ENABLED: "true"
    depends_on:
      honcho-db:
        condition: service_started
      valkey:
        condition: service_started
      # See honcho-api: the deriver's whole job is LLM calls, and a deriver
      # that runs before the gateway is listening fails silently.
      litellm:
        condition: service_healthy
    networks:
      - hermes-net

  # Ollama Cloud — the stack's chat-LLM provider — has no embeddings
  # endpoint, so Honcho's semantic search needs a stack-local embedder.
  # This server runs nomic-embed-text ONLY (274 MB, 768-dim vectors);
  # EMBEDDING_VECTOR_DIMENSIONS in honcho.env MUST match (768).
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - hermes-net

  # One-shot model pull: retries until the server is up, then exits.
  # Idempotent — re-runs harmlessly after a reboot or volume wipe.
  ollama-init:
    image: ollama/ollama:0.33.3
    container_name: ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until ollama pull nomic-embed-text; do echo "waiting for ollama..."; sleep 5; done; echo "nomic-embed-text ready"
    depends_on:
      - ollama
    networks:
      - hermes-net

  honcho-mcp:
    # Honcho's MCP server — what Hermes' mcp_servers.honcho entry
    # points at (http://honcho-mcp:3000/mcp). The Dockerfile lives in
    # mcp/ and COPYs its sources from there, so the git build context
    # uses the "#ref:subdir" form.
    build:
      context: https://github.com/plastic-labs/honcho.git#${HONCHO_VERSION:-main}:mcp
      dockerfile: Dockerfile
    image: honcho-mcp:${HONCHO_VERSION:-main}
    container_name: honcho-mcp
    restart: unless-stopped
    environment:
      HONCHO_API_URL: http://honcho-api:8000
    depends_on:
      - honcho-api
    networks:
      hermes-net:
        aliases: [honcho-mcp]

  honcho-db:
    image: pgvector/pgvector:pg15
    container_name: honcho-db
    restart: unless-stopped
    env_file:
      - ${HERMES_ENV_DIR:?}/honcho.env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # Upstream default. For anything exposed beyond the compose
      # network, switch to password auth (see the DB_CONNECTION_URI
      # note in honcho-api above).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - honcho-pgdata:/var/lib/postgresql/data
    networks:
      - hermes-net

networks:
  hermes-net:
    external: true

volumes:
  honcho-pgdata:
  ollama-models: