# Hermes agent containers — one service per profile.
#
# Local:  mise run up   (renders + creates the network first, via task deps)
# Komodo: part of the "hermes" Stack (<owner>/komodo -> resources.toml),
# which merges this file with honcho.compose.yml + firecrawl.compose.yml.
#
# Secrets: each service reads /etc/hermes/hermes-<profile>.env on the
# host (set HERMES_ENV_DIR to override for local dev, e.g. ./secrets).
# The same file is mounted to /data/.env because Hermes reads keys from
# its .env file. NEVER commit real secret files.
#
# All services join the shared external `hermes-net` network so the
# agents can reach honcho-mcp / firecrawl-api by service name.

services:
  hermes-main:
    build:
      # Repo-root context — the Dockerfile COPYs docker/hermes/*.sh and
      # the rendered overlay build/main/ from it (matches the Komodo
      # Build's build_path ".").
      context: ..
      dockerfile: docker/hermes/Dockerfile
      args:
        HERMES_REF: ${HERMES_REF:-v2026.8.31}
    image: hermes-agent:${HERMES_REF:-v2026.8.31}
    container_name: hermes-main
    restart: unless-stopped
    environment:
      HERMES_HOME: /data
      HERMES_MODE: gateway
      TZ: ${TZ:-UTC}
      # In-place updates (alternative to the git-pinned rebuild flow):
      # uncomment both this and the hermes-main-code volume below. The
      # code volume must stay mounted or updates are lost on recreate,
      # and image rebuilds will NOT update running code while mounted.
      # HERMES_UPDATE_ON_START: "true"
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/hermes-main.env
    volumes:
      - hermes-main-data:/data
      # The rendered overlay (build/main/) is baked into the image at
      # /overlay by the Dockerfile's final COPY layer — a config-only push
      # changes the image ID and the deploy recreates this service (the
      # config restart path). A bind mount at /overlay would shadow the
      # baked copy; only add one for non-main profiles.
      # Hermes reads keys from $HERMES_HOME/.env
      - ${HERMES_ENV_DIR:?}/hermes-main.env:/data/.env
      # GitHub App private key (root-owned on host, created during setup —
      # see secrets/hermes-main.env.example). Must exist before deploy.
      # Named per profile (github-app-<profile>.pem) so each profile can
      # carry its own GitHub App later; GITHUB_APP_PRIVATE_KEY_PATH in the
      # profile's env file points at the mounted path.
      - ${HERMES_ENV_DIR:?}/github-app-main.pem:/etc/hermes/github-app-main.pem:ro
      # Komodo control-plane API auth header (X-API-KEY). komodo-core joins
      # hermes-net, so the agent manages the control plane itself at
      # http://komodo-core-1:9120 — see config/profiles/main/skills/komodo-ops.
      # Host path default kept in this file; overrides go in the stack
      # environment (resources.toml) as KOMODO_AUTH_HEADER.
      - ${KOMODO_AUTH_HEADER:-/home/ubuntu/.komodo-auth-header}:/etc/komodo-auth-header:ro
      # Uncomment to enable Hermes' "docker" terminal backend, letting
      # the agent run sibling containers on the host docker daemon.
      # This is a wide grant of host privilege — only do it for
      # profiles you fully trust.
      # - /var/run/docker.sock:/var/run/docker.sock
      # In-place update mode (see HERMES_UPDATE_ON_START above):
      # - hermes-main-code:/usr/local/lib/hermes-agent
    networks:
      hermes-net:
        aliases: [hermes-main]

  # Second profile example. Rendered from config/profiles/researcher/.
  # Uncomment to run; profiles are independent agents with separate
  # memory, sessions, and gateway config.
  # hermes-researcher:
  #   build:
  #     context: ../docker/hermes
  #     args:
  #       HERMES_REF: ${HERMES_REF:-v2026.8.31}
  #   image: hermes-agent:${HERMES_REF:-v2026.8.31}
  #   container_name: hermes-researcher
  #   restart: unless-stopped
  #   environment:
  #     HERMES_HOME: /data
  #     HERMES_MODE: gateway
  #     TZ: ${TZ:-UTC}
  #   env_file:
  #     - ${HERMES_ENV_DIR:?}/hermes-researcher.env
  #   volumes:
  #     - hermes-researcher-data:/data
  #     # Binds over the image's baked (main) overlay with this profile's.
  #     - ../build/researcher:/overlay:ro
  #     - ${HERMES_ENV_DIR:?}/hermes-researcher.env:/data/.env
  #   networks:
  #     hermes-net:
  #       aliases: [hermes-researcher]

networks:
  hermes-net:
    external: true

volumes:
  hermes-main-data:
  # hermes-researcher-data:
  # hermes-main-code: