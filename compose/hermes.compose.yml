# Hermes agent container — ONE container, all profiles (official-image
# deployment model, docs/user-guide/docker#multi-profile-support).
#
# The image FROMs nousresearch/hermes-agent:v<HERMES_REF> (see
# docker/hermes/Dockerfile): the official image's s6-overlay supervision
# tree registers a gateway-<profile> s6 service per profile, auto-restarts
# crashed gateways, and re-creates the slots on every container restart
# from the profiles' persisted state. The default profile is always
# registered; extra profiles are declarative adds via the rendered
# overlays (config/ -> render.py at build time -> /overlay/<profile>),
# provisioned on first boot by the baked bootstrap-profiles.sh.
#
# Local:  mise run up   (creates the network first, via task deps)
# Komodo: part of the "hermes" Stack (<owner>/komodo -> resources.toml),
# which merges this file with honcho.compose.yml + firecrawl.compose.yml.
#
# Secrets: read from /etc/hermes/hermes-main.env on the host (set
# HERMES_ENV_DIR to override for local dev, e.g. ./secrets). The file is
# bind-mounted read-only AND injected as container env (env_file); the
# entrypoint syncs it to $HERMES_HOME/.env because Hermes reads keys from
# its .env file (load_hermes_dotenv, override=True) and the s6 services
# run as an unprivileged user who can't read the root-owned mount.
# NEVER commit real secret files.
#
# Profiles share this container's env; every profile's config is its own
# (rendered from config/profiles/<name>/). The default profile = the repo's
# primary agent (config/profiles/default/, rendered as /overlay/default).
services:
  hermes-main:
    build:
      # Repo-root context — the Dockerfile COPYs docker/hermes/*.sh,
      # render.py, and config/ from it (matches the Komodo Build's
      # build_path ".").
      context: ..
      dockerfile: docker/hermes/Dockerfile
      args:
        # The FROM pin of the thin image (official base tag). Locally mise
        # exports it from mise.toml [env]; Komodo repeats it in the stack
        # environment (resources.toml).
        HERMES_REF: ${HERMES_REF:-v2026.9.14}
    # Image name matches the Komodo Build resource's output tag (defined
    # in the <owner>/komodo control-plane repo) — do not rename here.
    image: hermes-agent:${HERMES_REF:-v2026.9.14}
    container_name: hermes-main
    restart: unless-stopped
    environment:
      HERMES_HOME: /opt/data
      TZ: ${TZ:-UTC}
      # One shared gateway for all profiles: the default profile's
      # gateway multiplexes inbound platform connections and relays
      # per-profile routing (named gateway slots stay registered for
      # explicit lifecycle management but don't auto-start). Operator
      # env override — beats gateway.multiplex_profiles in config.yaml.
      # Single-profile deployment: multiplexing is a no-op with no named
      # profiles (the default gateway is the only one). Kept set so adding
      # a profile later never forks a second Discord connection.
      GATEWAY_MULTIPLEX_PROFILES: "true"
      # The GitHub App PEM reaches the container at this fixed mount;
      # the entrypoint copies it into the runtime-owned tool-home (see
      # docker/hermes/entrypoint.sh) because s6 services run as the
      # unprivileged `hermes` user.
      GITHUB_APP_PEM_MOUNT: /run/hermes-pem/github-app-main.pem
      # Where the agent finds the Komodo control-plane auth header. Declared
      # HERE, in the container environment, and not exported by the entrypoint:
      # s6-overlay services start from the container's environment (via
      # /run/s6/container_environment), NOT from the entrypoint process's
      # exports — so an `export` in entrypoint.sh is invisible to the gateway
      # and to its tool subprocesses. The entrypoint's job is the FILE (copy it
      # off the unreadable read-only mount into the runtime-owned home on every
      # boot); pointing at that file is configuration. See the komodo-ops skill.
      KOMODO_AUTH_HEADER: /opt/data/home/komodo-auth-header
      # Headless Chromium CDP sidecar for the browser tools — see
      # docker/hermes/s6-rc.d/chromium-cdp/ (binds 127.0.0.1 only; the
      # rendered browser.cdp_url points the agent at it).
      HERMES_CHROMIUM_CDP: "1"
      # The dashboard s6 service (docker/s6-rc.d/dashboard in the official
      # image): always declared, gated here like HERMES_CHROMIUM_CDP.
      # DISABLED by default. The flip surface is the STACK environment
      # (komodo/resources.toml / mise.toml [env]) — NOT hermes-main.env:
      # compose `environment:` overrides env_file, so a value in the env
      # file never reaches this gate. Flipping HERMES_DASHBOARD on without
      # the three HERMES_DASHBOARD_BASIC_AUTH_* vars in the env file fails
      # closed at startup (the dashboard slot restart-loops; the rest of
      # the container is unaffected) — see secrets/hermes-main.env.example.
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-0}
      # Explicit, though it is also the upstream container default: the
      # published loopback port needs a non-loopback in-container bind,
      # and the fail-closed auth gate is what makes that safe here.
      HERMES_DASHBOARD_HOST: 0.0.0.0
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/hermes-main.env
    depends_on:
      # Every turn goes through the gateway, and litellm binds its port only
      # AFTER it has fetched the provider catalogue (observed ~1-2 minutes on
      # this host). Without this, compose starts the agent alongside the
      # gateway and the first turn can race a port that is not open yet.
      # `service_healthy` is litellm's own /health/liveliness probe
      # (compose/litellm.compose.yml): uvicorn only accepts connections once
      # app startup has completed, so a passing probe really does mean
      # "serving".
      # NOTE the trade-off, deliberate: if litellm never becomes healthy, this
      # service does not start either — the ordering is the point, and the
      # probe's start_period covers the boot litellm actually needs.
      litellm:
        condition: service_healthy
    volumes:
      - hermes-main-data:/opt/data
      # The env file is bind-mounted read-only and synced to
      # $HERMES_HOME/.env by the entrypoint (s6 services run as the
      # unprivileged `hermes` user, so the root-owned host mount is
      # unreadable in place; the runtime-owned copy in the volume is what
      # load_hermes_dotenv loads with override=True).
      - ${HERMES_ENV_DIR:?}/hermes-main.env:/run/hermes-env/hermes-main.env:ro
      # The rendered overlays (baked in the image at /overlay by the
      # build-time render.py run) ride the image-ID recreation path: a
      # config-only push changes the image, the deploy recreates this
      # service, and the entrypoint re-applies the overlay. (Do NOT bind
      # -mount /overlay: on a fresh clone there is no local build/ dir,
      # and a stale local copy would shadow the freshly baked one.)
      # GitHub App private keys (root-owned on host, created during
      # setup — see secrets/hermes-main.env.example). The whole secrets
      # dir is mounted read-only: github-app-main.pem for the main App,
      # github-app-<profile>.pem for each team-profile App (planner,
      # developer, reviewer). The entrypoint copies each into the
      # runtime-owned tool-homes and repoints the env vars there.
      - ${HERMES_ENV_DIR:?}/:/run/hermes-pem:ro
      # Komodo control-plane API auth header (X-API-KEY). komodo-core joins
      # hermes-net, so the agent manages the control plane itself at
      # http://komodo-core-1:9120 — see config/profiles/default/skills/komodo-ops.
      # Host path default kept in this file; the MOUNT path is overridable via
      # the stack environment (resources.toml) as KOMODO_AUTH_HEADER_MOUNT.
      #
      # The mount itself is NOT readable by the agent: it is 600 and owned by
      # the host user, while the s6 services run as UID 10000. The entrypoint
      # copies it onto the data volume and exports KOMODO_AUTH_HEADER at the
      # copy — the same treatment the App PEMs get, and for the same reason.
      # Use `-H @$KOMODO_AUTH_HEADER` (see the komodo-ops skill), never the
      # mount path directly.
      - ${KOMODO_AUTH_HEADER_MOUNT:-/home/ubuntu/.komodo-auth-header}:/etc/komodo-auth-header:ro
      # Uncomment to enable Hermes' "docker" terminal backend, letting
      # the agent run sibling containers on the host docker daemon.
      # This is a wide grant of host privilege — only do it for
      # profiles you fully trust.
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      hermes-net:
        aliases: [hermes-main]
    # The Hermes dashboard (s6 service in this container, gated by
    # HERMES_DASHBOARD above). Published to HOST loopback only, like
    # firecrawl's API: the container binds 0.0.0.0 (Docker's port
    # publishing needs a non-loopback bind) while the actual boundary is
    # the fail-closed auth gate (the dashboard refuses to start without an
    # auth provider) plus this loopback-only publish. While
    # HERMES_DASHBOARD=0 nothing listens and the port refuses connections.
    # The HOST-side override var is deliberately NOT HERMES_DASHBOARD_PORT
    # — that name is the upstream CONTAINER port var and would change the
    # in-container listen port too, breaking the mapping.
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"

networks:
  hermes-net:
    external: true

volumes:
  hermes-main-data: