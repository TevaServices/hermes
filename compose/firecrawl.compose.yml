# Firecrawl — self-hosted web scraping/crawling
# (https://docs.firecrawl.dev/contributing/self-host).
#
# Local:  mise run up
# Komodo: part of the "hermes" Stack (<owner>/komodo -> resources.toml),
# which merges this file with hermes.compose.yml + honcho.compose.yml.
#
# Uses the images Firecrawl publishes to ghcr.io, tagged via
# mise.toml [env] -> FIRECRAWL_VERSION. The self-host API is intentionally
# minimal: USE_DB_AUTHENTICATION=false (trusted networks only — nothing
# is published off-host here) and TEST_API_KEY acts as the API key the
# MCP servers send (the agents' stdio firecrawl-mcp reads it as
# FIRECRAWL_API_KEY from the Hermes envs; the compose firecrawl-mcp
# service reads it from this same env file).
#
# The env wiring mirrors Firecrawl's upstream docker-compose.yaml, with
# three deliberate departures: the broker is LavinMQ, NOT upstream's
# rabbitmq:3-management (which idled at ~760 MB on this host — 564 MB of
# quorum-queue ETS with every queue empty; LavinMQ is a drop-in AMQP
# 0-9-1 broker idling at tens of MB, aliased firecrawl-rabbitmq — see
# compose/lavinmq.compose.yml for why the extract lane still needs one);
# NO redis service (compose/valkey.compose.yml serves both apps under
# the firecrawl-redis alias); and postgres is upstream's nuq-postgres.
# When bumping FIRECRAWL_VERSION, diff against upstream's compose file
# for that release — variable names occasionally change:
#   https://github.com/firecrawl/firecrawl/blob/main/docker-compose.yaml
#
# Secrets (TEST_API_KEY, POSTGRES_*) flow in via env_file from
# HERMES_ENV_DIR — compose does NOT interpolate ${...} from env_file
# entries, so nothing secret is referenced with ${} below. The
# postgres credentials are internal to the compose network; the API
# key is the only one clients (the Hermes agents) use.

x-firecrawl-common: &firecrawl-common
  environment: &firecrawl-env
    USE_DB_AUTHENTICATION: "false"
    # Upstream sets HOST=0.0.0.0; the app defaults to "localhost", which
    # binds IPv6 loopback only — the in-container harness check and the
    # published port both fail with ECONNREFUSED. Keep all-interfaces.
    HOST: 0.0.0.0
    # Right-sized small. The upstream defaults
    # (NUM_WORKERS_PER_QUEUE=8, NUQ_WORKER_COUNT=5, 10 concurrent
    # requests, 5 browsers) spawn a dozen node processes that starve the
    # box — the API then misses its hardcoded 60s "port must be up"
    # deadline and the harness restarts, forever. One worker per queue
    # keeps it comfortably inside that window (and leaves CPU for the
    # agent + honcho).
    NUQ_WORKER_COUNT: "1"
    NUM_WORKERS_PER_QUEUE: "1"
    MAX_CONCURRENT_JOBS: "2"
    CRAWL_CONCURRENT_REQUESTS: "2"
    BROWSER_POOL_SIZE: "1"
    REDIS_URL: redis://firecrawl-redis:6379
    REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
    PLAYWRIGHT_SERVICE_URL: http://firecrawl-playwright:3000
    # Only the extract lane needs this (extract-queue.ts producer +
    # extract-worker consumer have no non-AMQP fallback upstream; the
    # scrape path's NuQ runs Postgres-only). The broker is LavinMQ under
    # the firecrawl-rabbitmq alias — compose/lavinmq.compose.yml.
    NUQ_RABBITMQ_URL: amqp://guest:guest@firecrawl-rabbitmq:5672/%2F
    POSTGRES_HOST: firecrawl-db
    POSTGRES_PORT: "5432"

services:
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:${FIRECRAWL_VERSION:-latest}
    container_name: firecrawl-api
    restart: unless-stopped
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/firecrawl.env
    <<: *firecrawl-common
    depends_on:
      firecrawl-db:
        condition: service_started
      # firecrawl-redis is an alias of the shared valkey container
      # (compose/valkey.compose.yml).
      valkey:
        condition: service_started
      # The extract lane's broker (LavinMQ, aliased firecrawl-rabbitmq).
      lavinmq:
        condition: service_started
      # Firecrawl's LLM features (MODEL_NAME -> the `firecrawl` group) go
      # through the gateway, and litellm binds its port only after its
      # startup catalogue fetch.
      litellm:
        condition: service_healthy
    networks:
      hermes-net:
        aliases: [firecrawl-api]
    # Only the Hermes agents need this API (via hermes-net). Publish to
    # loopback only if you want to curl it from the host.
    ports:
      - "127.0.0.1:${FIRECRAWL_PORT:-3002}:3002"

  # The fence on the agent's web path: firecrawl-mcp talks to this, and this
  # talks to firecrawl-api. It forces Firecrawl's own checkPromptInjection
  # onto json scrapes, refuses egress carrying secrets or aimed at the
  # stack's own services, and sanitises what comes back (see
  # docker/firecrawl-guard/guard.py, and AGENTS.md for the findings behind
  # it). No published port: the host loopback port above bypasses it, which
  # is deliberate — a human curling 3002 is not the threat model.
  #
  # Built by a Komodo Build like the rest of the stack (the stack runs
  # run_build = false, so the Build resource supplies this image); the
  # `build:` key is for local `mise run up --build`, exactly as litellm and
  # hermes-main do it.
  firecrawl-guard:
    build:
      # Repo-root context (the Dockerfile COPYs docker/firecrawl-guard/ from
      # it) — matches the Komodo Build's build_path ".".
      context: ..
      dockerfile: docker/firecrawl-guard/Dockerfile
    image: firecrawl-guard:${HERMES_GUARD_REF:-latest}
    container_name: firecrawl-guard
    restart: unless-stopped
    environment:
      FIRECRAWL_UPSTREAM: http://firecrawl-api:3002
      FIRECRAWL_GUARD_PORT: "3003"
      # enforce applies the rules; monitor only logs what would have happened.
      FIRECRAWL_GUARD_MODE: ${FIRECRAWL_GUARD_MODE:-enforce}
      # open | cache-only | closed — the operator brake. Flips from the stack
      # environment (komodo/resources.toml, mirrored in mise.toml), never from
      # an env_file. See AGENTS.md §firecrawl-guard for what each means.
      FIRECRAWL_EGRESS: ${FIRECRAWL_EGRESS:-open}
      # Logical DB /2 of the shared valkey — Firecrawl holds /0, Honcho /1.
      FIRECRAWL_GUARD_CACHE_URL: redis://firecrawl-redis:6379/2
      FIRECRAWL_GUARD_CACHE_TTL: ${FIRECRAWL_GUARD_CACHE_TTL:-604800}
      # Opt-in egress allowlist, comma-separated, leading "." = suffix match.
      # Off by default: it breaks the open web, so it is a posture you choose.
      # FIRECRAWL_EGRESS_ALLOWLIST: "docs.example.com,.internal.example"
    depends_on:
      firecrawl-api:
        condition: service_started
      # firecrawl-redis is an alias of the shared valkey container.
      valkey:
        condition: service_started
    networks:
      hermes-net:
        aliases: [firecrawl-guard]
    healthcheck:
      # The image has no curl; python is the probe (same shape as litellm's).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3003/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # Small host. It buffers and re-serialises one response at a time
          # (MAX_BODY caps that at 16 MB), so this is generous, not tight.
          memory: 256m

  # LiteLLM's MCP gateway fronts Firecrawl through this service: the proxy's
  # `mcp_servers` (config/litellm.yaml) points at http://firecrawl-mcp:3000/mcp,
  # and MCP-capable gateway clients (the published-port callers) reach
  # Firecrawl's web surface with only their LiteLLM key. The Firecrawl
  # credential stays inside the stack, and the guard stays in the path:
  # FIRECRAWL_API_URL names firecrawl-guard:3003, NEVER firecrawl-api — the
  # guard sees plain /v2 REST from here, so its egress filter and sanitiser
  # apply exactly as they do for the agents' own stdio firecrawl-mcp
  # (config/integrations.toml), which deliberately remains the agents' path.
  # This package has no EXCLUDED_TOOLS in 3.x: only the two feedback tools
  # are droppable from the environment; the residual cloud-only surface
  # (research_*, monitor_*, developer/gov/usage search) is registered
  # unconditionally and fails at call time on the self-hosted API — tune it
  # out at the MCP client if the extra schemas matter.
  firecrawl-mcp:
    image: node:22-alpine
    container_name: firecrawl-mcp
    restart: unless-stopped
    # Version pinned deliberately here in the command: a baked image would
    # mean a new Komodo Build resource for a pure-JS package, so this is a
    # runtime npx fetch on every recreate instead (seconds; needs registry
    # egress at boot — the agent-side npx makes the same call). Bump this
    # literal on purpose; integrations.toml runs the package unpinned
    # agent-side and does not move with it.
    command: ["npx", "-y", "firecrawl-mcp@3.28.1"]
    environment:
      HTTP_STREAMABLE_SERVER: "true"
      # The same HOST trap as firecrawl-api: the default here is
      # "localhost", which binds container loopback only — the proxy would
      # ECONNREFUSED against it forever.
      HOST: 0.0.0.0
      PORT: "3000"
      FIRECRAWL_API_URL: http://firecrawl-guard:3003
      # Self-hosted mode tolerates a missing key at boot, but the API
      # behind the guard accepts only TEST_API_KEY — firecrawl.env carries
      # that value as FIRECRAWL_API_KEY for this file's env_file wiring.
      FIRECRAWL_NO_SEARCH_FEEDBACK: "1"
      FIRECRAWL_NO_ENDPOINT_FEEDBACK: "1"
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/firecrawl.env
    depends_on:
      firecrawl-guard:
        condition: service_started
    networks:
      - hermes-net
    healthcheck:
      # FastMCP ships /health (no auth); node is the probe (this image has
      # no curl either).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the npx registry fetch on boot.
      start_period: 30s
    deploy:
      resources:
        limits:
          # Small host: one node process (its search-companion listener
          # included) + the npx cache. Same generosity-not-tightness note
          # as the guard above.
          memory: 256m

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:${FIRECRAWL_VERSION:-latest}
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      PORT: "3000"
      BLOCK_MEDIA: "false"
    deploy:
      resources:
        limits:
          # Small host — a cpus limit above the host's core count is
          # unschedulable, so cap memory only.
          memory: 1g
    networks:
      - hermes-net

  firecrawl-db:
    image: ghcr.io/firecrawl/nuq-postgres:${FIRECRAWL_VERSION:-latest}
    container_name: firecrawl-db
    restart: unless-stopped
    # nuq-postgres runs /docker-entrypoint-initdb.d/010-nuq.sql on a
    # virgin data dir, and that script CREATE EXTENSIONs pg_cron — which
    # only works in the database named by cron.database_name (default
    # "postgres"; upstream compose uses POSTGRES_DB=postgres). We use
    # POSTGRES_DB=firecrawl, so pin the GUC; the postgres entrypoint
    # applies the command args to the initdb temp server too.
    command: postgres -c cron.database_name=firecrawl
    env_file:
      - ${HERMES_ENV_DIR:?}/firecrawl.env
    volumes:
      - firecrawl-db-data:/var/lib/postgresql/data
    networks:
      - hermes-net

networks:
  hermes-net:
    external: true

volumes:
  firecrawl-db-data: