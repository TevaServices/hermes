# LiteLLM proxy — the stack's single LLM gateway.
#
# Every app (Hermes, Honcho, Firecrawl) points at http://litellm:4000
# with the LITELLM_MASTER_KEY and sends a model name from
# config/litellm.yaml. LiteLLM routes among group members (latency-based)
# and falls back on failure — within groups, and (for the four tiers)
# through router_settings.fallbacks: a failing Ollama Cloud deployment
# cools down and the SAME tier is served by its OpenRouter fallback, with
# the primary re-probed when the cooldown expires. litellm.yaml's header
# documents the contract.
#
# Secrets: /etc/hermes/litellm.env on the host (set HERMES_ENV_DIR to
# override for local dev). Holds LITELLM_MASTER_KEY, OLLAMA_API_KEY,
# OPENROUTER_API_KEY, the gateway DATABASE_URL, and the Zitadel SSO
# credentials for the admin UI (/etc/hermes/litellm-db.env holds the DB
# container's own POSTGRES_*). NEVER commit real secret files.
#
# Joins the shared external `hermes-net` network so the apps reach it by
# service name.
#
# Image: built by the Komodo Build `litellm` (docker/litellm/Dockerfile —
# upstream multi-arch main-latest + config/litellm.yaml baked in as the
# final layer; the versioned upstream tags main-v1.x.y are amd64-only —
# match the tag to the host arch). auto_pull=false pins the local image.
# Config
# changes ride the image-ID path: a push to this repo invalidates the
# config COPY layer, the rebuild-hermes-agent procedure rebuilds
# litellm:main, and the deploy recreates the service — no bind mount, no
# manual restarts. Upstream upgrades: re-pull the base image on the host,
# then push (or RunBuild) to bake a fresh litellm:main.

services:
  litellm-db:
    # Postgres for the gateway: virtual keys, teams, budgets, SSO users and
    # the UI's state. Prisma migrations run during the litellm image's boot —
    # the healthcheck's start_period below covers them. Password auth (this
    # is not a trust-auth instance like honcho-db — anything on the mesh can
    # reach hermes-net's containers via the netbird forwarders, so the DB
    # holding every API credential is password-gated).
    image: postgres:15-alpine
    container_name: litellm-db
    restart: unless-stopped
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/litellm-db.env
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hermes-net

  litellm:
    build:
      # Repo-root context (the Dockerfile COPYs config/litellm.yaml from
      # it) — matches the Komodo Build's build_path ".".
      context: ..
      dockerfile: docker/litellm/Dockerfile
    image: litellm:main
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    depends_on:
      litellm-db:
        condition: service_healthy
      valkey:
        condition: service_started
    # Redis wiring (non-secret): the shared valkey, logical DB /3 — /0 is
    # Firecrawl's, /1 Honcho's, /2 the firecrawl-guard's cache. LLM response
    # caching stays OFF on purpose (litellm_settings.cache is deliberately
    # not set); Redis is
    # for litellm's internal state, not for serving cached completions.
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_DB: "3"
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/litellm.env
    healthcheck:
      # The image ships python and nothing else — no curl, no wget — so the
      # probe is python. /health/liveliness is the one health endpoint that
      # needs no auth (/health is 401 without the master key); more to the
      # point, uvicorn does not accept connections until app startup has
      # finished, and startup fetches the provider's model catalogue
      # (check_provider_endpoint). A 200 here therefore means "actually
      # serving", not merely "process alive" — which is the distinction the
      # dependent services need.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Covers the catalogue fetch before it binds. Observed ~1-2 minutes on
      # this host; a probe that gives up sooner would fail every dependent
      # service's start on a healthy gateway.
      start_period: 180s
    networks:
      hermes-net:
        aliases: [litellm]

networks:
  hermes-net:
    external: true

volumes:
  litellm-db-data:
