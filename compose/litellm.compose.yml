# LiteLLM proxy — the stack's single LLM gateway.
#
# Every app (Hermes, Honcho, Firecrawl) points at http://litellm:4000
# with the LITELLM_MASTER_KEY and sends a model name from
# config/litellm.yaml. LiteLLM routes among group members (latency-based)
# and falls back on failure.
#
# Secrets: /etc/hermes/litellm.env on the host (set HERMES_ENV_DIR to
# override for local dev). Holds LITELLM_MASTER_KEY, OLLAMA_API_KEY,
# OPENROUTER_API_KEY. NEVER commit real secret files.
#
# Joins the shared external `hermes-net` network so the apps reach it by
# service name.
#
# Image: built by the Komodo Build `litellm` (docker/litellm/Dockerfile —
# upstream multi-arch main-latest + config/litellm.yaml baked in as the
# final layer; the versioned upstream tags main-v1.x.y are amd64-only —
# match the tag to the host arch). auto_pull=false pins the local image.
# Config
# changes ride the image-ID path: a push to this repo invalidates the
# config COPY layer, the rebuild-hermes-agent procedure rebuilds
# litellm:main, and the deploy recreates the service — no bind mount, no
# manual restarts. Upstream upgrades: re-pull the base image on the host,
# then push (or RunBuild) to bake a fresh litellm:main.

services:
  litellm:
    build:
      # Repo-root context (the Dockerfile COPYs config/litellm.yaml from
      # it) — matches the Komodo Build's build_path ".".
      context: ..
      dockerfile: docker/litellm/Dockerfile
    image: litellm:main
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    env_file:
      - ${HERMES_ENV_DIR:?export HERMES_ENV_DIR (absolute) — see mise.toml}/litellm.env
    networks:
      hermes-net:
        aliases: [litellm]

networks:
  hermes-net:
    external: true
