# Model catalog — short, memorable aliases for models.
#
# Profiles reference models BY ALIAS (see profiles/<name>/profile.toml),
# so switching an agent from one model to another is a one-line change.
#
# Keys:
#   provider       — must match a key in providers.toml
#   model          — the provider's model ID exactly as the provider
#                    expects it (check `hermes model` picker or your
#                    provider dashboard for available IDs)
#   context_length — optional; emitted to Hermes `model.context_length`
#   description    — free-form note shown by `mise run render`

[models.fast]
provider = "ollama_cloud"
model = "gpt-oss:20b"
# Capping the window below gpt-oss' 128k native context keeps per-call
# history lean — the biggest token-usage lever there is.
context_length = 32768
description = "Smallest Ollama Cloud model; lowest token usage — simple-turn router + side tasks"

[models.smart]
provider = "ollama_cloud"
model = "gpt-oss:120b"
context_length = 32768
description = "Capable tier on Ollama Cloud; agent primary — effective at tool use without frontier-model token burn"

[models.frontier]
provider = "ollama_cloud"
model = "glm-5.3"
description = "Frontier reasoning on Ollama Cloud; burns heavy thinking tokens — opt in per-profile only"

[models.coder]
provider = "ollama_cloud"
model = "kimi-k2.7-code"
description = "Code-focused model on Ollama Cloud"