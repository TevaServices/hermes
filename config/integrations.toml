# Container integrations — Honcho (memory) and Firecrawl (web).
#
# Each integration defines the MCP server block render.py emits into
# every profile that lists it. Endpoints are service names on the shared
# `hermes-net` Docker network, so they work identically in local
# compose runs and Komodo-managed deployments.
#
# Honcho runs via compose/honcho.compose.yml:
#   honcho-api  — FastAPI server (port 8000)
#   honcho-mcp  — Honcho's MCP server for agent clients (port 3000)
# Firecrawl runs via compose/firecrawl.compose.yml:
#   firecrawl-api   — Firecrawl API server (port 3002)
#   firecrawl-guard — the egress/injection fence in front of it (port 3003)
#   firecrawl-mcp   — HTTP-mode MCP server the LiteLLM gateway fronts
#                     (litellm.yaml mcp_servers) for gateway clients; the
#                     agents' OWN firecrawl MCP server is the npx stdio
#                     invocation below, pointed at the guard.
#                     (firecrawl-mcp does not talk to firecrawl-api; it
#                     talks to the guard, which forwards to the API.)

[integrations.honcho]
label = "Honcho durable memory"
enabled = true
# MCP endpoint of the honcho-mcp container. If your Honcho version
# serves MCP at a different path (e.g. /mcp vs /sse), change it here —
# this is the only place you need to touch.
mcp_url = "http://honcho-mcp:3000/mcp"
# honcho-mcp refuses requests without a Bearer token and forwards it to
# honcho-api as the API key. With honcho-api's default no-auth self-host
# any non-empty value passes; set a real key here only if you enable auth
# on honcho-api (it must match there).
mcp_headers = { Authorization = "Bearer ${HONCHO_API_KEY}" }
required_env = ["HONCHO_API_KEY"]

[integrations.firecrawl]
label = "Firecrawl web scraping/crawling"
enabled = true
# firecrawl-mcp is an npx stdio MCP server pointed at the self-hosted
# API container. Hermes substitutes ${VAR} from its .env at runtime.
#
# The URL names firecrawl-guard, NOT firecrawl-api: the guard is the fence on
# this path (secret/SSRF egress refusal, injection sanitising, forced
# checkPromptInjection) and forwards to firecrawl-api:3002 behind it. See
# docker/firecrawl-guard/guard.py and AGENTS.md. Pointing this back at
# firecrawl-api is the escape hatch when the guard itself is the suspect.
mcp_command = "npx"
mcp_args = ["-y", "firecrawl-mcp"]
mcp_env = { FIRECRAWL_API_URL = "http://firecrawl-guard:3003", FIRECRAWL_API_KEY = "${FIRECRAWL_API_KEY}" }
# TEST_API_KEY is what the self-hosted Firecrawl API accepts when
# USE_DB_AUTHENTICATION=false.
required_env = ["FIRECRAWL_API_KEY"]
# The firecrawl-mcp server exposes ~30 tools, but the SELF-HOSTED API
# only implements part of the /v2 surface (verified against the running
# API + upstream logs, 2026-10-07; the catalog churns between releases —
# refresh this list against a live tools/list whenever the package moves).
# Working: scrape, search (the guard normalises the cloud-era search
# arguments newer package versions default in — docker/firecrawl-guard/
# guard.py `normalize_search`), crawl (+status), map, extract, parse,
# batch/scrape. Everything keyed to cloud-only backends fails here —
# excluded so their schemas don't pin every turn behind tool_search and
# never get called:
#   agent, agent_status            → cloud agent-orchestrator (+browser)
#   interact, interact_stop        → /v2/browser needs BROWSER_SERVICE_URL
#                                    (503 "feature is not configured")
#   developer_search               → proxies Firecrawl's hosted search index
#   gov_search                     → /v2/search/gov (cloud-only route, 404)
#   research_* (5)                 → /v2/search/research proxy (cloud-only)
#   find_tools                     → Alexandria provider catalogue (cloud-only)
#   credit_usage                   → /v2/team/credit-usage 500s self-hosted
#                                    (no AUTUMN_SECRET_KEY: billing is cloud-
#                                    only by design)
#   monitor_* (8)                  → monitor store needs cloud artifacts
#                                    (GCS); controller 500s self-hosted
#   feedback, search_feedback      → quality-telemetry for hosted search
mcp_tools_exclude = [
    "firecrawl_agent",
    "firecrawl_agent_status",
    "firecrawl_interact",
    "firecrawl_interact_stop",
    "firecrawl_developer_search",
    "firecrawl_gov_search",
    "firecrawl_credit_usage",
    "firecrawl_find_tools",
    "firecrawl_research_search_papers",
    "firecrawl_research_read_paper",
    "firecrawl_research_related_papers",
    "firecrawl_research_search_github",
    "firecrawl_research_inspect_paper",
    "firecrawl_monitor_create",
    "firecrawl_monitor_update",
    "firecrawl_monitor_get",
    "firecrawl_monitor_delete",
    "firecrawl_monitor_list",
    "firecrawl_monitor_run",
    "firecrawl_monitor_checks",
    "firecrawl_monitor_check",
    "firecrawl_feedback",
    "firecrawl_search_feedback",
]
[integrations.mach]
label = "mach — teva fleet exec + secrets (via the LiteLLM gateway)"
enabled = true
# The gateway fronts mach (litellm.yaml mcp_servers, auth_type
# true_passthrough): it holds no mach credential, so every request carries
# the agent's own mach key, forwarded verbatim as the upstream credential.
# Gateway admission rides x-litellm-api-key because Authorization carries the
# upstream token in passthrough mode. Both env vars live in hermes-main.env.
# Replaces the hand-edited mach block that lived in the default profile's
# runtime config.yaml (out-of-band until 2026-10-10) — a runtime edit is
# wiped by every container recreation; this renders from the repo.
mcp_url = "http://litellm:4000/mach/mcp"
mcp_headers = { "x-litellm-api-key" = "${LITELLM_API_KEY}", "x-mcp-mach-authorization" = "Bearer ${MACH_MCP_KEY}" }
required_env = ["LITELLM_API_KEY", "MACH_MCP_KEY"]
# Same toolset posture as the out-of-band entry this replaces. The per-server
# URL already serves only mach, so this is belt-and-braces.
mcp_tools_include = ["machines_list", "secrets_list", "exec"]

# Add further MCP integrations the same way — either url-based (see
# honcho) or stdio command-based (see firecrawl) — then list the
# integration key in a profile's `integrations = [...]`.