# Scheduled jobs — declared here, reconciled into each profile's cron
# store at container boot (bootstrap-profiles.sh -> cron-reconcile.py).
#
# This file is the source of truth. Editing a profile's cron store by
# hand is the same mistake as hand-editing /opt/data/config.yaml: it
# works until the next boot, then the reconciler puts it back. Use
# `hermes cron` for experiments; land anything permanent here.
#
# ## Why no_agent scripts
#
# A no_agent job runs its script and delivers the script's STDOUT
# verbatim to `deliver`. Empty stdout = SILENT — no message, no agent
# turn, no tokens. That is what makes a frequent self-pull affordable:
# the poll itself is free, and the profile's agent only wakes when there
# is actually something to do. An agent-prompted job would burn a full
# inference turn every tick just to discover there is nothing to do.
#
# `deliver = "bot-chat:<profile>"` injects the output into that profile's
# Bot Chat as a message the agent responds to — that is the wake-up path
# (name the profile explicitly; see "deliver must NAME the profile"
# below for why bare `bot-chat` is wrong on this stack). Delivering to the
# profile's Discord channel would NOT work: the Discord adapter drops the
# bot's own messages (adapter.py: `if message.author == self._client.user`),
# so the agent would never see it.
#
# ## The scripts and their contract
#
# `script` names a file under the profile's scripts dir; the reconciler
# seeds it on every boot — from the image (/usr/local/bin/, where the
# stack bakes its own helpers) and, for a package's jobs, from the
# package's own scripts/ dir that traveled with it — so the image+package
# are the source of truth for script CONTENT and this file for its
# SCHEDULE. A job whose script is missing is "unrunnable" and the
# scheduler AUTO-PAUSES it — which is why seeding is done at boot, before
# s6 starts anything.
#
# Both queue lanes declared by EXTERNAL profile packages exit 0 with
# output when there is work, exit 0 with NO output when they are
# healthy-but-idle, and print an incident ONCE (then stay silent until the
# condition changes) when the pipeline is broken — the stack holds no
# queue jobs of its own any more; a package's cron.toml declares its own
# lanes and the boot renderer renders them into the overlay.
#
# ## Fields
#
#   profile   which profile owns the job (its cron store + its scripts dir)
#   name      stable identity — the reconciler matches on this, so
#             RENAMING A JOB HERE CREATES A SECOND ONE unless you also
#             remove the old
#   schedule  cron expression or interval ("30m", "every 2h")
#   script    file seeded into <profile>/scripts/
#   no_agent  true = script stdout delivered verbatim (see above)
#   deliver   one of the targets below
#   prompt    optional; only meaningful for agent jobs (no_agent = false)
#
# ## Choosing a delivery target
#
#   bot-chat:<profile>   WAKE that profile's agent with the output as a
#                        message it responds to. For jobs that hand over
#                        work. ALWAYS name the profile — see below.
#   discord:<chat_id>    Post into a Discord channel as the owning
#                        profile's bot. This is an OUTBOUND send: the
#                        "the adapter drops the bot's own messages" rule
#                        that blocks bot-chat-by-Discord is about INBOUND
#                        delivery, so it does not apply here. Used for
#                        stack plumbing — no agent turn is wanted. The
#                        channel id comes from @@DISCORD_HOME_CHANNEL@@
#                        (see secrets/hermes-main.env.example).
#   local                Save the output, deliver nothing.
#   origin               The chat the job was created from — NOT
#                        meaningful for a job declared here (there was no
#                        originating chat), so do not use it.
#
# A job that FAILS (non-zero exit) is delivered too, via the scheduler's
# own one-line failure notice — deduped per failure signature, so a
# persistent fault alerts once rather than every tick. That is why a
# script should exit non-zero when it genuinely failed, and why it must
# print its diagnostics on STDOUT: stderr is discarded on the happy path
# and never reaches the channel at all.
#
# ## deliver must NAME the profile
#
# Bare `bot-chat` means "the job's own profile", but that resolution is
# NOT what happens on this stack. The delivery runs the target profile's
# agent via `hermes chat`, and with no profile argument the subprocess
# inherits the firing scheduler's HERMES_HOME — and under
# GATEWAY_MULTIPLEX_PROFILES every profile's ticker shares the gateway
# process, whose HERMES_HOME is the DEFAULT profile. Observed live: the
# developer's queue was delivered to the main profile and
# `hermes-main[bot]` claimed a developer issue, breaking the
# identity model ("never impersonate another role").
#
# `bot-chat:<name>` instead passes `-p <name>` and DROPS HERMES_HOME from
# the child env (scheduler.py: `env.pop("HERMES_HOME", None)`), so the
# turn really runs as the named profile. The name is validated at create
# time against the local profile tree.
#
# Managed names are prefixed "team: " — that prefix is what `--prune`
# treats as stack-owned, so a job the AGENT created for itself is never
# removed by the reconciler.
#
# ## Two kinds of job, deliberately
#
# THIS FILE is for jobs the stack wants to exist permanently: the schedule
# is reviewed in a PR, rendered, and reconciled at every boot. That
# reviewed-permanence is the property to preserve — a standing watchdog
# belongs here, not in an agent's turn.
#
# The `cronjob` toolset is nonetheless enabled for every profile (it was
# removed from the team profiles' agent.disabled_toolsets on 2026-09-15, so
# an agent can watch something over time without waiting on a human. The
# rules that keep that from becoming unattended spend live in
# config/SOUL_OPERATING.md and the hermes-stack-ops skill:
#
#   * SELF-CLEANING ONLY — a job an agent creates removes itself once its
#     condition resolves (cronjob_manage action="remove" on its own id,
#     then answer; upstream explicitly supports a job removing itself and
#     still delivering its final response). No standing recurring jobs.
#   * A persistent watchdog goes through THIS file, via a PR.
#   * Prefer no_agent script jobs — they cost zero tokens (see below).
#
# `cron.allow_agent_scheduling` stays at its upstream default (false), so
# an agent RUNNING INSIDE a cron job cannot schedule further jobs. That is
# loop prevention only: it is not what gates the toolset in a normal
# gateway session (tools/cronjob_tools.py check_cronjob_requirements), so
# `agent.disabled_toolsets` remains the reliable stack-side fence.

# ---------------------------------------------------------------------------
# Housekeeping. THESE are the stack's own plumbing jobs — they report to
# #hermes-home, NOT to a profile's bot chat: there is no decision for an
# agent to make, so waking one would be a wasted turn. `deliver =
# "discord:<chat_id>"` is an OUTBOUND post (the adapter's "drop the bot's
# own messages" rule is about INBOUND, so it does not apply here).
# Delivered via the gateway's home channel: the channel id comes from
# @@DISCORD_HOME_CHANNEL@@ (see secrets/hermes-main.env.example).
# These three were once hand-seeded and NOT declared here, which meant a
# volume rebuild silently lost them — see AGENTS.md §"Scheduled jobs are
# GitOps-declared".
# ---------------------------------------------------------------------------

# NOTE: the software-team delivery lanes (the planner / developer /
# reviewer / release self-pull queues) are NOT declared here any more. The
# stack's repo knows no profiles but its own builtin set; the team package
# shipped to the profile-source path carries its own cron.toml with its
# lanes (same schema, same reconciler) — see
# docker/hermes/render-drop-profiles.py.

# Keep Claude Code current. Silent when already current — the script's
# stdout IS the delivery, so an up-to-date run says nothing. A FAILED
# install prints its reason on STDOUT and exits non-zero (it used to
# print to stderr and exit 0, which is how a totally broken install
# reported `ok` every day for weeks while claude-real sat frozen).
[[jobs]]
profile = "default"
name = "team: claude code update"
schedule = "37 4 * * *"
script = "claude-update.sh"
no_agent = true
deliver = "discord:@@DISCORD_HOME_CHANNEL@@"  # #hermes-home

# Weekly prune of per-session git worktrees. Silent unless it removed
# something.
[[jobs]]
profile = "default"
name = "team: weekly worktree prune"
schedule = "0 5 * * 1"
script = "prune-repos.sh"
no_agent = true
deliver = "discord:@@DISCORD_HOME_CHANNEL@@"  # #hermes-home

# Daily refresh of the central bare clones (local branch mirrors, which a
# plain worktree cut would otherwise read stale). Silent when every repo
# refreshed cleanly; prints and fails when any did not.
[[jobs]]
profile = "default"
name = "team: daily repo refresh"
schedule = "0 6 * * *"
script = "refresh-repos.sh"
no_agent = true
deliver = "discord:@@DISCORD_HOME_CHANNEL@@"  # #hermes-home
