# LiteLLM proxy config — the stack's single LLM gateway, and the ONE file
# that decides which upstream provider actually answers.
#
# ── The contract: four tier names ─────────────────────────────────────────
# Hermes, Honcho and Firecrawl never name a provider or an upstream model
# id. They send one of four names, and everything to the right of
# `litellm_params:` is yours to point anywhere:
#
#   cheap    — cheapest competent work: the short/simple-turn lane
#              (smart_model_routing), the light auxiliary side tasks
#              (session search, web extract, skills hub) and Honcho's
#              VOLUME lanes (the deriver, which runs on every message, and
#              the minimal/low dialectic levels).
#   smart    — the everyday tier: the planner profile, plus Honcho's
#              REASONING lanes (dream deduction/induction, summaries, and
#              the medium/high/max dialectic levels).
#   smarter  — the workhorse (1M window at flash economics): the default,
#              developer and release profiles, and context compression, run
#              here.
#   smartest — the top of the ladder: judgment work (the reviewer profile)
#              and the opt-in escalation an agent reaches for with
#              `/model smartest`.
#
# Swapping provider = editing this file. Tier names are stable; the backends
# behind them are not. Everything else in the repo knows only the tier name
# and its context window (config/models.toml), so a tier repointed at a
# model with a different window needs that entry updated in the same change;
# scripts/check-model-windows.py verifies the pair against the provider's
# own API.
#
# A tier may have SEVERAL deployments: repeat the same `model_name` and the
# router spreads across them and fails over between them. Give every member
# of a tier the same capability class — a fallback with a smaller context
# window silently breaks long-context work.
#
# render.py reads this file at image build time and FAILS THE BUILD when a
# tier declared in config/models.toml has no group here (or is not covered by
# a "*" wildcard name). It accepts `model_name:` as a list item, quoted or
# unquoted — keep that shape when adding groups.
#
# Model names are what the apps send. Groups (multiple entries sharing a
# model_name) are spread across by the router_settings strategy.
#
# The "ollama/*" wildcard serves every other Ollama Cloud model with no
# config change: LiteLLM replaces the "*" with the requested model ID and
# passes it through to ollama.com verbatim. Explicit entries always win over
# the wildcard (exact match before pattern). It is the one Ollama-specific
# block here, kept as the "try a model before promoting it to a tier"
# affordance; an implementer on another provider deletes it.

model_list:
  # ── The four tiers ────────────────────────────────────────────────────
  # Ollama Cloud today, through its OpenAI-compatible endpoint. Each entry
  # is exactly what the "ollama/*" wildcard below expands to per request —
  # the tiers are spelled out so that pointing one at another provider is a
  # local edit rather than a new route.
  #
  # Windows (config/models.toml, verified via POST ollama.com/api/show):
  # cheap/smart 262144, smarter/smartest 1048576. `smartest` has NO vision —
  # fine for its only consumer (a diff review contains no images), but
  # kimi-k3 (1M, vision+tools+thinking) is the drop-in swap if the
  # escalation tier ever needs to accept images.
  - model_name: cheap
    litellm_params:
      model: openai/nemotron-3-nano:30b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: smart
    litellm_params:
      model: openai/gemma4:cloud
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: smarter
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: smartest
    litellm_params:
      model: openai/glm-5.3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  # ── OpenRouter fallbacks — consulted ONLY when a tier's Ollama Cloud
  #    deployment fails (router_settings.fallbacks below). NOT tier members:
  #    they never split healthy tier traffic (latency-based-routing would
  #    send real work to the paid provider otherwise), so a request that
  #    names a tier hits Ollama while it is healthy and hits these ONLY
  #    through the cooldown fallback path. Same-model matching, pinned from
  #    OpenRouter's own catalog (GET openrouter.ai/api/v1/models — recheck
  #    with scripts/check-model-windows.py, which enforces both the window
  #    contract and tools support): every fallback's window is >= its tier's
  #    declared window (config/models.toml), because a fallback with a
  #    smaller window silently breaks long-context work. Name == the
  #    OpenRouter id so `gh`-shaped callers, the /model switch and curl can
  #    exercise each one directly (also how /v1/models lists them).
  #    kimi-k3 rides `smartest` as its second fallback (1M, vision — the
  #    drop-in swap the tier comment names, used here as the second-choice
  #    fallback rather than as the tier).
  - model_name: openrouter/nvidia/nemotron-3-nano-30b-a3b
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/google/gemma-4-31b-it
    litellm_params:
      model: openrouter/google/gemma-4-31b-it
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/z-ai/glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/z-ai/glm-5.3
    litellm_params:
      model: openrouter/z-ai/glm-5.3
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/moonshotai/kimi-k3
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/deepseek/deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/minimax/minimax-m3
    litellm_params:
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: openrouter/nvidia/nemotron-3-ultra-550b-a55b
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/OPENROUTER_API_KEY

  # ── The bare-name aliases — the DEFAULT vocabulary: unprefixed, no
  #    provider/vendor prefix, no Ollama Cloud suffix. Each alias is a
  #    one-member group served from Ollama Cloud first, with a
  #    router_settings.fallbacks chain (below) to its OpenRouter twin —
  #    same model, same capability class — consulted when Ollama Cloud is
  #    down, unavailable or out of usage (429). The namespacing differs
  #    (Ollama: bare ids, sometimes with a size variant like `:30b`;
  #    OpenRouter: vendor-prefixed ids), which is exactly what THIS table
  #    owns: the caller says `glm-5.3-flash`, the gateway knows the Ollama
  #    id AND the OpenRouter id. Adding an alias = an entry here (the
  #    Ollama id as `openai/<id>`), a fallbacks line naming its OpenRouter
  #    twin, and a context_length row in config/models.toml — all three in
  #    the same change; check-model-windows then verifies the pair against
  #    both providers.
  #
  #    Deliberately NOT attempted: heuristic catalog matching (strip a
  #    vendor prefix / model-name fuzz to auto-pair the two catalogs). A
  #    wrong silent match serves the WRONG model — an explicit table is
  #    the one shape where a missing pair fails LOUDLY instead of
  #    serving badly. The wildcards above remain the catch-alls with the
  #    prefixes; `ollama/glm-5.3-flash` even takes the alias's fallback
  #    (the resolver strips the literal `ollama/` provider prefix), so
  #    both spellings behave identically; a bare id with NO alias (and no
  #    tier) is a loud 400.
  #
  #    Ollama Cloud answers bare ids directly ("gemma4" without ":cloud";
  #    measured live 2026-10-06) — except ids whose variant selector IS
  #    the identity ("nemotron-3-nano" bare 404s), where the real id
  #    stays inside litellm_params and never reaches the caller.
  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: gemma4
    litellm_params:
      model: openai/gemma4
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: nemotron-3-nano
    litellm_params:
      model: openai/nemotron-3-nano:30b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: minimax-m3
    litellm_params:
      model: openai/minimax-m3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: nemotron-3-ultra
    litellm_params:
      model: openai/nemotron-3-ultra
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  # ── firecrawl — Firecrawl's LLM features (MODEL_NAME). NOT a tier: it
  #    serves one app that only ever ingests PUBLIC web pages, and is
  #    OpenRouter ONLY because schema-bound extraction needs
  #    response_format json_schema, which Ollama Cloud strips. Both members
  #    are json_schema-capable. This group is also what a "never sees
  #    private data" lane looks like — copy the shape if another one appears.
  #
  #    These two use OPENROUTER_FREE_KEY, NOT the shared OPENROUTER_API_KEY,
  #    and it is the only place that key appears. The account's OpenRouter
  #    guardrail enforces ZDR, which excludes :free endpoints outright
  #    ("ZDR violation (guardrail): 1 endpoint excluded") — so on the shared
  #    key this whole group 404s and takes Firecrawl's /extract and v2
  #    json-format scrapes down with it (and, since the guard forces
  #    checkPromptInjection, the classifier fails open too). A free-models
  #    key with no ZDR guardrail is what makes free endpoints usable. It is
  #    scoped HERE on purpose: the tier fallbacks below stay on the shared
  #    key, so relaxing ZDR buys the public-web lane only. Do not let this
  #    key leak into a tier.
  - model_name: firecrawl
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_FREE_KEY
  - model_name: firecrawl
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_FREE_KEY

  # ── nomic-embed-text — Honcho embeddings, proxied to the stack-local
  #    ollama service (Ollama Cloud has no embeddings endpoint).
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  # ── Ollama Cloud wildcard — any Ollama Cloud model not listed above,
  #    callable as "ollama/<model-id>" with no config change (new Ollama
  #    Cloud releases need only a redeploy-free name). The apps see the
  #    full catalogue via /v1/models, which LiteLLM expands from the
  #    provider's own model list (check_provider_endpoint below); the
  #    "ollama/" prefix keeps those listed names callable as-shown.
  #    No load balancing or fallbacks on this route — it is one
  #    passthrough deployment, like every other Ollama Cloud entry.
  #
  #    NOTE the window caveat: a model reached through the wildcard has no
  #    declared context window (config/models.toml declares windows per
  #    TIER), so Hermes and the `claude` wrapper fall back to their own
  #    guesses for it. Promote a model to a tier before relying on it.
  - model_name: "ollama/*"
    litellm_params:
      model: openai/*
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  # ── OpenRouter wildcard — every OpenRouter model, callable as
  #    "openrouter/<model-id>" (e.g. openrouter/openai/gpt-4o-mini) with no
  #    config change. Mirrors the "ollama/*" wildcard above: the
  #    try-before-promoting affordance, single passthrough, no load
  #    balancing, no fallbacks. It rides the SHARED OpenRouter key
  #    (non-free, ZDR-guarded) — NOT OPENROUTER_FREE_KEY, which is scoped to
  #    the firecrawl group only. The five explicit openrouter/<id> entries
  #    above are the router's fallback ids and always win over this wildcard
  #    (exact match before pattern). NOTE the window caveat, same as the
  #    ollama wildcard: a model reached through this wildcard has no
  #    declared context window (config/models.toml declares windows per
  #    TIER) — promote a model to a tier before relying on it.
  - model_name: "openrouter/*"
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  # Pick the fastest healthy member of a group per request, and retry the
  # others on failure. Inert for the single-member tiers; it matters for the
  # firecrawl group (the only 2-member one) and for any tier an implementer
  # gives more than one deployment.
  #
  # Caveat for firecrawl: latency-based routing CONCENTRATES traffic on the
  # faster member where simple-shuffle would split it 50/50, so free-tier
  # rate-limit pressure lands differently. If extraction starts returning
  # errors, delete this block (the default is simple-shuffle). Note
  # cooldown_time below now also applies to the firecrawl members — a 429
  # parks one for the cooldown while its sibling serves.
  routing_strategy: latency-based-routing
  num_retries: 1
  cooldown_time: 60
  # ── Ollama Cloud outage fallbacks (observed live 2026-10-02 17:50Z:
  #    Ollama's subscription "session usage limit" 429'd every tier, retried
  #    twice, then propagated to the callers). A failed tier deployment —
  #    429/subscription limit, 401, timeout, connection failure — cools the
  #    Ollama deployment down per-deployment (cooldown_time above; a 429
  #    cools down IMMEDIATELY, no need to exceed allowed_fails), the request
  #    fails over to the listed OpenRouter id in order, and the cooled
  #    deployment is re-probed when the cooldown expires — so a refreshed
  #    Ollama subscription returns traffic to Ollama on its own, observable
  #    via the response's `model` field / x-litellm-model-api-base header and
  #    litellm's own cooldown log lines. Cooldown state is in-memory: a
  #    gateway recreate resets it. During the window requests inside the
  #    cooldown go STRAIGHT to the fallback (no retry latency).
  #
  #    Every fallback is a same-model match on OpenRouter with a window >=
  #    its tier's declared window and tools support — the pair is what
  #    scripts/check-model-windows.py enforces. Hermes does not fail between
  #    tiers on top of this (no fallback_model in the profiles) — the gateway
  #    owns the failure path.
  #
  #    NO `firecrawl` entry (its two :free members fail over within the
  #    group) and NO `default_fallbacks` (that would give the `ollama/*`
  #    wildcard route a fallback and a silent paid path — the wildcard is
  #    explicitly single-passthrough). One fallback list per line, a plain
  #    JSON array value — that literal shape is what
  #    scripts/check-model-windows.py parses.
  fallbacks:
    - cheap: ["openrouter/nvidia/nemotron-3-nano-30b-a3b"]
    - smart: ["openrouter/google/gemma-4-31b-it"]
    - smarter: ["openrouter/z-ai/glm-5.3-flash"]
    - smartest: ["openrouter/z-ai/glm-5.3", "openrouter/moonshotai/kimi-k3"]
    # The bare-name aliases (see the model_list block): same semantics as
    # the tiers — Ollama Cloud first, then the OpenRouter twin. Deliberate
    # per-NAME chains; there is still NO "*" default_fallbacks, so an
    # undeclared name (or the unprefixed wildcards) fails loudly. An
    # "ollama/"-prefixed spelling of an alias shares the chain via
    # stripped-match; an "openrouter/"-prefixed spelling never does.
    - glm-5.3-flash: ["openrouter/z-ai/glm-5.3-flash"]
    - glm-5.3: ["openrouter/z-ai/glm-5.3"]
    - kimi-k3: ["openrouter/moonshotai/kimi-k3"]
    - gemma4: ["openrouter/google/gemma-4-31b-it"]
    - nemotron-3-nano: ["openrouter/nvidia/nemotron-3-nano-30b-a3b"]
    - deepseek-v4.1-flash: ["openrouter/deepseek/deepseek-v4.1-flash"]
    - minimax-m3: ["openrouter/minimax/minimax-m3"]
    - nemotron-3-ultra: ["openrouter/nvidia/nemotron-3-ultra-550b-a55b"]

litellm_settings:
  # Expand the "ollama/*" wildcard in /v1/models by querying the
  # provider's own model list (per-deployment api_base — Ollama Cloud for
  # the wildcard) instead of falling back to LiteLLM's static OpenAI
  # catalogue.
  check_provider_endpoint: true
  # Drop provider-unsupported request params instead of erroring. This is
  # the documented fix for the failure observed live 2026-10-02: OpenAI
  # clients send embeddings with the DEFAULT `encoding_format: float`,
  # which the ollama provider rejects (`UnsupportedParamsError`) — Honcho's
  # nomic-embed-text calls were failing on it. Dropping is safe here: the
  # ollama provider returns floats regardless.
  drop_params: true
# ── Proxy/UI settings ────────────────────────────────────────────────────
# The admin UI must not fall back to environment credentials (UI_USERNAME/
# UI_PASSWORD — or the master key when UI_PASSWORD is unset) as a proxy-admin
# login: that is one shared static secret for everything. Login paths kept:
# Zitadel SSO (the normal one) and DB-stored account passwords (the
# break-glass one — the proxy_admin user's own password). The master key is
# API-only from here on.
general_settings:
  disable_env_credential_login: true

# ── Firecrawl via the MCP gateway ─────────────────────────────────────────
# Firecrawl's MCP surface rides the proxy: it exposes the server's tools at
# /mcp on this same published port, so MCP-capable gateway clients (the
# published-port callers — NOT the Hermes agents) can search/scrape with
# only their LiteLLM key. The firecrawl-mcp service
# (compose/firecrawl.compose.yml) holds the Firecrawl credential itself and
# points at the firecrawl-guard, keeping the fence on the path. The Hermes
# profiles deliberately stay on their integrations.toml stdio server
# (tool-filtered for the tool_search budget); do not wire this path into
# them as well.
#
# The catalog is the service's own registration (compose pins it to
# firecrawl-mcp@3.20.1 — versions 3.21+ register the cloud-only surface
# this API does not implement, research_*/monitor_*/gov+developer_search/
# credit_usage/find_tools, which then fail at call time), and these
# mcp_servers entries carry NO tool-filtering keys in this LiteLLM version —
# the agent-side exclude list in integrations.toml is the only config seam.
# What remains advertised but cloud-only here: agent(+status),
# interact(+stop), monitor_* — loud-failing, self-hosted-dead. The guard
# normalises cloud-era /v2/search bodies, so search behaves on whichever
# package version sits in front of it. After a gateway rebuild, verify the
# listing plus (at least) one tools/call search AND scrape.
mcp_servers:
  firecrawl:
    url: "http://firecrawl-mcp:3000/mcp"
    transport: "http"
    description: "Self-hosted Firecrawl — web search, scrape, crawl, extract, map"
