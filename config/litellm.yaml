# LiteLLM proxy config — the stack's single LLM gateway.
#
# Every app (Hermes, Honcho, Firecrawl) points at http://litellm:4000
# with the LITELLM_MASTER_KEY and sends a model name from the list
# below. LiteLLM routes each request to a member of that model's group
# (latency-based) and falls back to another member on failure.
#
# Upstreams:
#   - Ollama Cloud (https://ollama.com/v1) — the chat LLM provider the
#     stack already used; key from OLLAMA_API_KEY in litellm.env.
#   - OpenRouter free models — json_schema-capable (Ollama Cloud strips
#     response_format json_schema, which broke Firecrawl's SmartScrape
#     extraction); key from OPENROUTER_API_KEY in litellm.env.
#   - Local ollama (http://ollama:11434) — nomic-embed-text embeddings
#     only (Ollama Cloud has no embeddings endpoint).
#
# Model names are what the apps send. Groups (multiple entries sharing a
# model_name) are routed among by the router_settings strategy.
#
# The "ollama/*" wildcard serves every OTHER Ollama Cloud model with no
# config change: LiteLLM replaces the "*" with the requested model ID and
# passes it through to ollama.com verbatim. Explicit entries always win
# over the wildcard (exact match before pattern).

model_list:
  # ── firecrawl — Firecrawl's LLM features (MODEL_NAME). OpenRouter
  #    ONLY: schema-bound extraction needs response_format json_schema,
  #    which Ollama Cloud strips. Both members are json_schema-capable.
  - model_name: firecrawl
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: firecrawl
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ── nomic-embed-text — Honcho embeddings, proxied to the stack-local
  #    ollama service (Ollama Cloud has no embeddings endpoint).
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  # ── Ollama Cloud wildcard — any Ollama Cloud model not listed above,
  #    callable as "ollama/<model-id>" with no config change (new Ollama
  #    Cloud releases need only a redeploy-free name). The apps see the
  #    full catalogue via /v1/models, which LiteLLM expands from the
  #    provider's own model list (check_provider_endpoint below); the
  #    "ollama/" prefix keeps those listed names callable as-shown.
  #    No load balancing or fallbacks on this route — it is one
  #    passthrough deployment, like every other Ollama Cloud entry.
  - model_name: "ollama/*"
    litellm_params:
      model: openai/*
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

litellm_settings:
  # Expand the "ollama/*" wildcard in /v1/models by querying the
  # provider's own model list (per-deployment api_base — Ollama Cloud for
  # the wildcard) instead of falling back to LiteLLM's static OpenAI
  # catalogue.
  check_provider_endpoint: true