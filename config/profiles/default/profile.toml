# The default profile ("default" — the ROOT Hermes profile, $HERMES_HOME
# itself) — one Hermes agent = one container (compose/hermes.compose.yml
# hosts ALL profiles under the official image's s6 supervision).
#
# Everything here is rendered by render.py INTO the image at build time
# (overlay baked at /overlay/default, applied by the entrypoint on every
# container start). Instead of editing a long Hermes config.yaml, change
# a line here and push — the image rebuild carries the config.

# Model aliases from config/models.toml. Everyday chat and agent turns
# run on "baseline" (glm-5.3-flash — 1M window); a failing baseline falls
# back UP to "elevated" (glm-5.3), which is also the opt-in tier for hard
# reasoning (/model elevated mid-session). smart_model_routing below sends
# short/simple turns to the "nano" model (nemotron-3-nano:30b), so
# chit-chat costs the minimum. Targeted side tasks route per task:
# compression (needs intelligence + big window) rides the aux env pin on
# glm-5.3-flash = baseline; light side tasks (web extract, skills hub) are
# pinned to nano. Honcho's consumers run on "ultra" (see honcho.env).
model = "baseline"
fallback_model = "elevated"

# Enabled integrations from config/integrations.toml
integrations = ["honcho", "firecrawl"]

# Messaging platforms for `hermes gateway`. Verified wiring (not
# guesswork): gateway/config.py enables a platform from the mere
# presence of its token env var — DISCORD_BOT_TOKEN in
# /etc/hermes/hermes-main.env (plus DISCORD_ALLOWED_USERS for access
# control). The discord.py 2.7.1 dependency ships in the hermes-agent
# image venv. The bot needs the "Message Content" AND "Server Members"
# privileged intents toggled in the Discord developer portal.
platforms = ["discord"]

# Free-form Hermes config passthrough: every key under [config_extra]
# is merged verbatim into the generated config.yaml top level. Use it
# for settings render.py has no abstraction for (check the Hermes
# configuration reference for valid keys).
#
# Tool search (progressive disclosure): 66 MCP schemas (honcho+firecrawl)
# ≈ 18k tokens would pin every turn against a small context window — past
# the 50% compaction threshold before any history existed. tool_search
# replaces the deferred MCP schemas with three bridge tools + a listing
# manifest.
# (Requires HERMES_REF >= the release that ships tools/tool_search.py.)
[config_extra.tools.tool_search]
enabled = "on"
[config_extra]
# Headless Chromium CDP sidecar: the container has no desktop Chrome, so
# browser-harness (browser_exec) has nothing to attach to — tool calls
# died with "chrome-not-running". The image runs a supervised headless
# Chromium (s6 service chromium-cdp, PLAYWRIGHT headless shell baked into
# the base image) serving CDP on 127.0.0.1:9333; this points Hermes'
# browser backend at it (BROWSER_CDP_URL/BU_CDP_URL resolution, same
# precedence the built-in tools honor). Toggled with the service by
# HERMES_CHROMIUM_CDP in the stack environment (compose/env).
[config_extra.browser]
cdp_url = "http://127.0.0.1:9333"

# Least-costly-while-effective routing: short, single-line messages with
# no code/tools/URLs go to the cheap model (the low-intelligence tier —
# "nano"); everything else uses the primary. `provider` is the named
# custom provider from providers.toml (rendered into config.yaml
# `custom_providers:`), so it shares the same LITELLM_API_KEY. The
# "ollama/" prefix matches the gateway's ollama/* wildcard route.
[config_extra.smart_model_routing]
enabled = true
[config_extra.smart_model_routing.cheap_model]
provider = "litellm"
model = "ollama/nemotron-3-nano:30b"

# --- Agile SaaS team routing -----------------------------------------------
# The team profiles (planner / developer / reviewer) live under
# config/profiles/<name>/ and share this container + the multiplexed
# Discord connection. Each team bot has its own Discord token (resolved
# from its own .env via entrypoint.sh PROFILE_<NAME>_* mapping); the
# routes below send each team channel's traffic to its profile. Channel
# IDs are filled in after the bots join the server (routes keyed on
# chat_id are most-specific; thread_id outranks chat_id).
#
# To discover IDs: Discord → Advanced settings → Developer Mode, then
# right-click a channel → "Copy Channel ID". Unmatched traffic keeps
# the historical default-profile behavior (this main agent).
#
# NOTE: a team profile with platforms=["discord"] but NO token of its
# own (PROFILE_<NAME>_DISCORD_BOT_TOKEN empty) is skipped by the
# multiplexer with a warning — the team stays dormant until its token
# lands. That is the intended staged-rollout behavior.
#
# To enable routing, UNCOMMENT the block below and fill in the channel
# IDs (Developer Mode → right-click channel → Copy Channel ID):
# [config_extra.gateway.profile_routes]
# planning_channel = { platform = "discord", chat_id = "<#planning id>", profile = "planner" }
# dev_channel      = { platform = "discord", chat_id = "<#dev id>",      profile = "developer" }
# reviews_channel  = { platform = "discord", chat_id = "<#reviews id>",  profile = "reviewer" }

# Extra env var placeholders render.py should list in .env.example.
# [env]
# MY_TOOL_TOKEN = ""