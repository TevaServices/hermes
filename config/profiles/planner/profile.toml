# "planner" agent profile — PM + product design (one profile).

# Renders into the image at /overlay/profiles/planner/ and runs INSIDE the
# same container as the default profile (official image's s6 supervision;
# the default profile's multiplexed gateway routes Discord per channel via
# gateway.profile_routes — named gateways are NOT started: do NOT run
# `hermes -p planner gateway start` while multiplexing).

# PM/design work: issue writing, backlog grooming, design specs — the
# highest-volume writing on the stack, and rarely more than 256K of context
# at once, so the planner is the profile on the "smart" tier (256K, vision,
# cheapest published price). Escalate a hard design job mid-session with
# `/model smarter`. Tier names come from config/models.toml; which backend
# sits behind each one is config/litellm.yaml's business.
model = "smart"
# The tier a failing primary should move to. NOTE: render.py validates this
# and uses it to collect env keys, but does NOT emit it into the rendered
# config.yaml — nothing in config.yaml expresses a fallback today, so treat
# this as documented intent rather than an active safety net. Escalate by
# hand with `/model smarter`. (See AGENTS.md §"Agent runtime invariants".)
fallback_model = "smarter"
integrations = ["honcho", "firecrawl"]
platforms = ["discord"]

[config_extra]
# Team-role toolset fence: the DOCUMENTED global-disable key
# (agent.disabled_toolsets — applies after per-platform tool config and
# always removes the listed toolsets). The team roles stay narrow: no
# browser (web reads ride the web toolset / Firecrawl MCP), no media
# generation, no computer_use/homeassistant.
#
# `delegation` and `cronjob` are deliberately ENABLED — removed from this
# list on 2026-09-15. Subagents are fresh-context reasoning (a child that
# cannot inherit the parent's wrong assumptions), and a scheduled job is
# how a role watches something over time. Both are bounded, not open:
#   * children — concurrency 2, flat (no orchestrators), and NO worktree
#     isolation on this stack (see STACK_DELEGATION_DEFAULTS in render.py
#     and AGENTS.md §Delegation);
#   * jobs — self-cleaning only, never a standing watchdog; a permanent
#     schedule belongs in config/cron.toml via a PR. See SOUL_OPERATING.md.
# Leaving `delegation` in this list would be load-bearing the other way: a
# child INHERITS the parent's disabled_toolsets, so it would remove
# delegate_task from this profile and from every child it could spawn.
[config_extra.agent]
disabled_toolsets = [
    "browser",
    "computer_use",
    "image_gen",
    "tts",
    "video_gen",
    "video",
    "homeassistant",
    "x_search",
]

# Discord: #planning ONLY, and no @mention needed there.
#
# NOTE THE FORM. These keys go in the NESTED `platforms.discord.extra`
# block — NOT the public top-level `discord:` one. The public form's
# require_mention is translated by the plugin hook
# (plugins/platforms/discord/adapter.py _apply_yaml_config) into
# PROCESS-GLOBAL os.environ["DISCORD_REQUIRE_MENTION"], first-writer-wins.
# All four profiles share one gateway process under
# GATEWAY_MULTIPLEX_PROFILES, so that write leaks: the default profile's
# extra carries no require_mention, adapter.py::_discord_require_mention
# falls through to os.getenv, and the MAIN bot would answer every message
# in every channel it can see. The nested form lands in
# PlatformConfig.extra (config.py PlatformConfig.from_dict), which the
# adapter reads FIRST and which is per-profile by construction — the same
# isolation rule as issue #72348.
#
# require_mention = false skips the mention gate. Deliberately NOT
# `free_response_channels`: a free-response channel sets is_free_channel,
# which upstream ALSO uses to skip auto-threading (adapter.py:
# `skip_thread = ... or is_free_channel`) — and the team workflow depends
# on the thread ("planner comments the issue link back into the Discord
# thread"; the planner bot really does own threads in #planning today).
#
# allowed_channels is load-bearing, not decoration: require_mention is
# profile-wide, so without the fence this bot would answer every message
# in every channel it can see — #hermes and its teammates' channels
# included. Threads stay reachable because the gate matches a thread's
# parent channel too. Keep the two keys together. It does NOT widen
# authorization: DISCORD_ALLOWED_USERS remains the gate (adapter
# _is_allowed_user falls back to channel-scoped access only when no
# user/role allowlist exists).
[config_extra.platforms.discord.extra]
allowed_channels = ["@@DISCORD_CHANNEL_PLANNER@@"]
require_mention = false

# Extra env placeholders rendered into .env.example (secrets arrive via
# the host env file mapped by entrypoint.sh PROFILE_<NAME>_<VAR>).
[env]
DISCORD_BOT_TOKEN = ""
GITHUB_APP_ID = ""
GITHUB_APP_INSTALLATION_ID = ""
GITHUB_APP_PRIVATE_KEY_PATH = ""

# Headless Chromium CDP sidecar — see config/profiles/default/profile.toml
# (the s6 service chromium-cdp serves CDP on 127.0.0.1:9333; gated by
# HERMES_CHROMIUM_CDP in compose).
[config_extra.browser]
cdp_url = "http://127.0.0.1:9333"
