# "researcher" agent profile — a second, web-heavy agent demonstrating
# multi-profile deployment. Rendered to build/researcher/ and run as a
# separate container (see the commented hermes-researcher service in
# compose/hermes.compose.yml).

# Research is multi-step tool-heavy work — run it on the capable tier
# ("smart" = mistral-large-3:675b) with the cheap model as failure fallback.
model = "smart"
fallback_model = "fast"
integrations = ["honcho", "firecrawl"]
platforms = []

[config_extra]
# Example passthrough: Hermes config keys you want set only for this
# profile go here.
# max_tokens = 8192

# [env]