# "main" agent profile — one Hermes agent = one container (compose/hermes.compose.yml).
#
# Everything here compiles into build/main/ via `mise run render`, which is
# mounted into the container as its config overlay. Instead of editing a
# long Hermes config.yaml, change a line here and re-render.

# Model aliases from config/models.toml. Primary work (tool calling,
# multi-step tasks) runs on "smart" (mistral-large-3:675b — Ollama Cloud's
# 675B Mistral flagship, a real step up from gpt-oss:120b); smart_model_routing
# below sends short/simple turns to the cheap "fast" model (gpt-oss:20b), so
# everyday chit-chat costs the minimum. "frontier" (glm-5.3) remains one
# line away if this agent ever needs heavy reasoning.
model = "smart"
fallback_model = "fast"

# Enabled integrations from config/integrations.toml
integrations = ["honcho", "firecrawl"]

# Messaging platforms for `hermes gateway`. Verified wiring (not
# guesswork): gateway/config.py enables a platform from the mere
# presence of its token env var — DISCORD_BOT_TOKEN in
# /etc/hermes/hermes-main.env (plus DISCORD_ALLOWED_USERS for access
# control). The discord.py 2.7.1 dependency ships in the hermes-agent
# image venv. The bot needs the "Message Content" AND "Server Members"
# privileged intents toggled in the Discord developer portal.
platforms = ["discord"]

# Free-form Hermes config passthrough: every key under [config_extra]
# is merged verbatim into the generated config.yaml top level. Use it
# for settings render.py has no abstraction for (check the Hermes
# configuration reference for valid keys).
[config_extra]
# Least-costly-while-effective routing: short, single-line messages with
# no code/tools/URLs go to the cheap model; everything else uses the
# primary. `provider` is the named custom provider from providers.toml
# (rendered into config.yaml `custom_providers:`), so it shares the same
# LITELLM_API_KEY.
[config_extra.smart_model_routing]
enabled = true
[config_extra.smart_model_routing.cheap_model]
provider = "litellm"
model = "gpt-oss:20b"

# Extra env var placeholders render.py should list in .env.example.
# [env]
# MY_TOOL_TOKEN = ""