model:
  provider: litellm
  default: mistral-large-3:675b
  base_url: http://litellm:4000
  api_mode: chat_completions
custom_providers:
  - name: litellm
    base_url: http://litellm:4000
    api_mode: chat_completions
    api_key: ${LITELLM_API_KEY}
  - name: ollama
    base_url: http://host.docker.internal:11434/v1
    api_mode: chat_completions
mcp_servers:
  honcho:
    url: http://honcho-mcp:3000/mcp
    enabled: true
    headers:
      Authorization: Bearer ${HONCHO_API_KEY}
  firecrawl:
    command: npx
    args: ["-y", "firecrawl-mcp"]
    enabled: true
    env:
      FIRECRAWL_API_URL: http://firecrawl-api:3002
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
tools:
  tool_search:
    enabled: "on"
smart_model_routing:
  enabled: true
  cheap_model:
    provider: litellm
    model: gpt-oss:20b
